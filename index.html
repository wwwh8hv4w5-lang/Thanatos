/* THANATOS PRO-CODING redesign */
:root{
 --bg:#07090d;--panel:#0d1118;--panel2:#111925;--line:#202b3a;--text:#edf3fb;
 --muted:#8492a6;--purple:#a78bfa;--purple2:#6d4bd1;--danger:#ff7188;--ok:#49e69a;
 --cyan:#67d9ff;--surface:rgba(13,17,24,.88)
}
html{background:var(--bg);scroll-behavior:smooth}
body{
 background:
  radial-gradient(ellipse at 50% -18%,rgba(99,102,241,.18),transparent 48%),
  radial-gradient(ellipse at 100% 70%,rgba(25,154,201,.055),transparent 38%),
  linear-gradient(rgba(72,94,122,.045) 1px,transparent 1px),
  linear-gradient(90deg,rgba(72,94,122,.045) 1px,transparent 1px),var(--bg);
 background-size:auto,auto,28px 28px,28px 28px,auto;
 color:var(--text)
}
body:before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;background:linear-gradient(110deg,transparent 0 49.8%,rgba(167,139,250,.025) 50%,transparent 50.2%);opacity:.8}
.app{position:relative;z-index:1;max-width:1440px;width:100%;height:100dvh;min-height:560px;padding:0 clamp(16px,3.4vw,52px)}
header{height:76px;border-bottom:1px solid rgba(117,143,177,.18);position:relative}
header:after{content:"";position:absolute;bottom:-1px;left:0;width:130px;height:1px;background:linear-gradient(90deg,var(--purple),transparent);animation:headerGlow 5s ease-in-out infinite}
.brand{gap:14px}
.logo{width:42px;height:42px;border-radius:13px;border-color:#3b4160;background:linear-gradient(145deg,#201b38,#10141e);box-shadow:0 0 26px rgba(139,92,246,.14);transition:transform .35s,box-shadow .35s}
.logo:hover{transform:rotate(-5deg) scale(1.04);box-shadow:0 0 34px rgba(139,92,246,.3)}
.brand h1{font-size:14px;letter-spacing:.17em}
.brand p{font-size:10px;color:#8b9ab0;letter-spacing:.18em}
.mode-bar{padding:18px 0 5px;gap:8px}
.mode-btn{position:relative;overflow:hidden;border:1px solid #273247;background:rgba(15,20,30,.9);color:#9ba9bd;border-radius:9px;padding:9px 17px;font-size:11px;letter-spacing:.04em;transition:transform .2s,border-color .25s,background .25s,color .25s,box-shadow .25s}
.mode-btn:before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent,rgba(167,139,250,.12),transparent);transform:translateX(-120%);transition:transform .6s}
.mode-btn:hover:before{transform:translateX(120%)}
.mode-btn:hover{border-color:#6552a1;color:#f5f1ff;transform:translateY(-1px)}
.mode-btn.active{background:linear-gradient(135deg,rgba(109,75,209,.26),rgba(20,26,39,.96));border-color:#8b72df;color:#fff;box-shadow:0 0 0 1px rgba(139,114,223,.1),0 7px 25px rgba(86,59,168,.14)}
.mode-btn.active:after{content:"";position:absolute;bottom:0;left:22%;right:22%;height:2px;background:linear-gradient(90deg,transparent,var(--purple),transparent)}
.mode-note{color:#77879d;font-size:10px;letter-spacing:.03em}
.usage-wrap{width:min(520px,100%);margin:11px auto 13px;padding:0 3px}
.usage-label{color:#a9f6ce;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
.usage-track{height:7px;background:#0b1714;border:1px solid #1e4d37;box-shadow:inset 0 1px 3px #0008}
.usage-fill{background:linear-gradient(90deg,#159957,#45f2a0);box-shadow:0 0 16px #28d98166;position:relative}
.usage-fill:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:usageShimmer 2.4s linear infinite}
.model-pill{background:rgba(14,19,28,.8);border-color:#273247;color:#c5d0df;font-size:11px;letter-spacing:.02em}
.dot{background:var(--ok);box-shadow:0 0 10px #49e69a;animation:statusPulse 2s ease-in-out infinite}
.icon-btn{background:#111723;border-color:#29364b;color:#bac7d9;transition:all .2s}
.icon-btn:hover{border-color:#8870d7;color:white;transform:translateY(-1px)}
main{min-height:0}








.messages{padding:28px 0 20px;gap:26px;scrollbar-width:thin;scrollbar-color:#39445b transparent}
.message{animation:messageIn .3s ease-out both}
.avatar{border:1px solid #51447e;background:linear-gradient(145deg,#292044,#111723);color:#c8baff;border-radius:10px}
.user .avatar{border-color:#28516b;background:#11202b;color:#7ee0ff}
.user .bubble{background:linear-gradient(135deg,#182232,#111824);border:1px solid #2a3d55;border-radius:15px 5px 15px 15px;padding:13px 16px}
.assistant .bubble{line-height:1.75}
.bubble pre{background:#080c12;border:1px solid #26334a;border-radius:12px;box-shadow:0 10px 30px #0003}
.live-preview{border-color:#34435b;border-radius:13px;box-shadow:0 12px 35px #0004}
.live-preview-head{background:#111a28;border-color:#29364b}
.live-preview-head button{background:#1a2638;border-color:#35445e}
.composer-wrap{padding:12px 0 22px}
.composer{position:relative;border:1px solid #2a374c;background:rgba(13,18,27,.96);border-radius:17px;padding:15px 15px 12px;box-shadow:0 18px 60px rgba(0,0,0,.34),0 0 0 1px rgba(167,139,250,.025);transition:border-color .25s,box-shadow .25s}
.composer:after{content:"";position:absolute;top:-1px;left:18px;width:85px;height:1px;background:linear-gradient(90deg,var(--purple),transparent);opacity:.8}
.composer:focus-within{border-color:#7966bd;box-shadow:0 18px 60px #0005,0 0 0 3px rgba(139,92,246,.09)}
.composer textarea{min-height:62px;line-height:1.6}
.composer textarea::placeholder{color:#66758a}
.composer-bottom{border-top:1px solid rgba(105,126,157,.13);padding-top:10px}
.composer-note{color:#73849b;font-size:10px}
.send{background:linear-gradient(135deg,#8b5cf6,#5d4bd1);border:1px solid #a48aff;border-radius:11px;box-shadow:0 5px 20px rgba(109,75,209,.22);transition:transform .2s,box-shadow .2s,filter .2s}
.send:hover{background:linear-gradient(135deg,#a78bfa,#7660e8);transform:translateY(-2px);box-shadow:0 8px 25px rgba(109,75,209,.35)}
.send:active{transform:scale(.96)}
.status{font-size:11px;color:#8495ad}
.status.ok{color:#5de8a4}.status.error{color:#ff8296}
.overlay{background:rgba(2,4,8,.78);backdrop-filter:blur(14px);animation:fadeIn .2s ease both}
.modal{background:linear-gradient(145deg,#141b29,#0c111a);border:1px solid #33415a;border-radius:20px;box-shadow:0 30px 100px #000b;animation:modalIn .3s cubic-bezier(.2,.8,.2,1) both}
.modal h3{color:#f1edff}
.field span{color:#bac7d9}
.field input,.field select{background:#090e16;border-color:#2b394f;border-radius:11px}
.field input:focus,.field select:focus{border-color:#8b72df;box-shadow:0 0 0 3px #8b5cf622}
.help{color:#8999af}
.secondary,.primary{border-radius:11px;transition:transform .2s,filter .2s}
.secondary{background:#172131;border-color:#2e3c53;color:#c4d0e0}
.primary{background:linear-gradient(135deg,#8b5cf6,#5d4bd1);border-color:#9d83ff}
.primary:hover{background:linear-gradient(135deg,#a78bfa,#7660e8);transform:translateY(-1px)}
@keyframes riseIn{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}
@keyframes messageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes heroFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes statusPulse{0%,100%{opacity:1;box-shadow:0 0 10px #49e69a}50%{opacity:.6;box-shadow:0 0 3px #49e69a}}
@keyframes usageShimmer{from{transform:translateX(-100%)}to{transform:translateX(200%)}}
@keyframes headerGlow{0%,100%{opacity:.5;transform:scaleX(.75);transform-origin:left}50%{opacity:1;transform:scaleX(1.25);transform-origin:left}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@media(max-width:650px){
 .app{padding:0 13px;min-height:500px}
 header{height:68px}
 .brand{gap:9px}.logo{width:36px;height:36px}.brand h1{font-size:12px;letter-spacing:.11em}.brand p{font-size:9px;letter-spacing:.1em}
 .header-actions{gap:5px}.model-pill{padding:6px 8px;font-size:10px}.icon-btn{width:35px;height:35px}
 .mode-bar{gap:5px;padding-top:13px}.mode-btn{padding:8px 10px;font-size:10px}
 
 
 .composer-wrap{padding-bottom:max(12px,env(safe-area-inset-bottom))}
 .composer-note{max-width:220px;line-height:1.4}
 .messages{padding-top:18px}
}
@media(prefers-reduced-motion:reduce){
 *,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}
}


/* Touch,selection and zoom stability (iOS/iPadOS) */
html{
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  touch-action: pan-x pan-y;
  overscroll-behavior: none;
}
body {
  margin: 0;
  width: 100%;
  min-width: 0;
  overflow: hidden;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: none;
}
*,*::before,*::after{
  -webkit-tap-highlight-color: transparent;
}
button,input,textarea,select,a,[role="button"],.mode-btn,.icon-btn,.send{
  touch-action: manipulation;
}
button,.mode-btn,.icon-btn,.send,.logo,header,.brand,.model-pill{
  -webkit-user-select: none;
  user-select: none;
}
input,textarea,select,pre,code,.bubble,.messages{
  -webkit-user-select: text;
  user-select: text;
}
img,svg,.logo{
  -webkit-user-drag: none;
}
@media (max-width: 820px) {
  html,body{
    width: 100%;
    height: 100%;
    height: 100dvh;
    max-width: 100vw;
  }
  .app {
    width: 100%;
    max-width: 100vw;
    height: 100dvh;
    min-height: 0;
    overflow: hidden;
    box-sizing: border-box;
    padding-left: max(12px, env(safe-area-inset-left));
    padding-right: max(12px, env(safe-area-inset-right));
    padding-bottom: env(safe-area-inset-bottom);
  }
  .messages,main{
    min-width: 0;
  }
  .messages {
    overflow-y: auto;
    overscroll-behavior-y: contain;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }
  .composer textarea {
    font-size: 16px !important;
  }
  input,textarea,select{
    font-size: 16px;
  }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto !important; }
}


/* Pro coding workbench: files,languages,prompt presets */
.workspace-tools{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0 0 12px}
.tool-btn,.file-chip,.language-select{font:inherit;font-size:11px;color:#c8d4e5;background:#101824;border:1px solid #2a394f;border-radius:9px;padding:8px 11px}
.tool-btn{cursor:pointer;transition:all .18s}
.tool-btn:hover{border-color:#8b72df;background:#1a2031;color:#fff;transform:translateY(-1px)}
.tool-btn.primary-tool{background:linear-gradient(135deg,#7352cf,#4e45a8);border-color:#9881ef;color:white}
.file-input-hidden{display:none!important}
.file-dock{display:none;flex-wrap:wrap;gap:7px;margin:0 0 10px}
.file-dock.has-files{display:flex}
.file-chip{display:flex;align-items:center;gap:7px;max-width:100%;overflow-wrap:anywhere}
.file-chip button{border:0;background:transparent;color:#ff91a3;font-size:14px;padding:0 2px;cursor:pointer}
.language-select{max-width:180px}
.tool-hint{font-size:10px;color:#8190a5}


.photo-preview-list{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0 12px}
.photo-preview{display:flex;align-items:center;gap:8px;padding:6px 9px;background:#101824;border:1px solid #2a394f;border-radius:10px;max-width:100%}
.photo-preview img{width:48px;height:48px;object-fit:cover;border-radius:7px}
.photo-preview span{font-size:11px;color:#c8d4e5;max-width:180px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.photo-preview button{border:0;background:transparent;color:#ff91a3;font-size:16px;cursor:pointer}


/* Professional typography system — local fonts only,no external dependencies */
:root{
  --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-code: ui-monospace, "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace;
}
html,body,button,input,textarea,select,option,label,.app,.brand,.mode-btn,.model-pill,.composer,.composer-note,.status,.modal,.field,.tool-btn,.file-chip,.language-select,.photo-preview,.tool-hint{
  font-family: var(--font-ui) !important;
  font-kerning: normal;
  font-feature-settings: "kern" 1, "liga" 1;
  letter-spacing: normal;
}
body { font-size: 14px; line-height: 1.55; font-weight: 400; }
h1,h2,h3,h4,h5,h6,.brand h1,.modal h3{
  font-family: var(--font-ui) !important;
  font-weight: 650;
  letter-spacing: -0.025em;
}
p,li,.bubble,.help,.field span{
  font-family: var(--font-ui) !important;
  font-weight: 400;
  line-height: 1.7;
}
button,.mode-btn,.tool-btn,.primary,.secondary,.send{
  font-family: var(--font-ui) !important;

  letter-spacing: -0.005em;
}
input,textarea,select{
  font-family: var(--font-ui) !important;
  font-size: 16px;
  line-height: 1.55;
  font-weight: 400;
}
pre,code,kbd,samp,.code-block,.code-content{
  font-family: var(--font-code) !important;

@media (min-width: 800px) {

  .bubble { font-size: 14px; }

/* Strict monochrome developer palette: black / charcoal / grey only */
:root {
  --bg: #080808;
  --panel: #101010;
  --panel2: #171717;
  --line: #303030;
  --text: #eeeeee;
  --muted: #a0a0a0;
  --purple: #bdbdbd;
  --purple2: #777777;
  --danger: #c2c2c2;
  --ok: #c8c8c8;
  --cyan: #d0d0d0;
  --surface: rgba(16,16,16,.94);
}
html,body{
  color: var(--text) !important;
  background-color: var(--bg) !important;

 const DOCTRINE = `CONSIGNE SYSTÈME — THANATOS (FSM AI, onglet Code)

Tu es Thanatos, la gamme de FSM AI dédiée au code. Tu comprends d'abord, tu planifies, tu exécutes par petites étapes vérifiables, puis tu contrôles ton travail avant de le livrer. Ton neutre et professionnel, sans autopromotion. Réponds dans la langue de la personne.

PRIORITÉS
1. Règles FSM ci-dessous. 2. Consignes explicites de la personne. 3. Cette méthode.

RÈGLES FSM (sans exception)
- Aucun secret dans le code : n'affiche jamais et n'écris jamais en dur une clé d'API, un mot de passe ou un jeton. Utilise une variable d'environnement, un fichier de configuration exclu du dépôt ou un champ de réglage, avec une valeur factice signalée (VOTRE_CLE_ICI). Si un secret est collé dans la demande, ne le recopie pas et conseille de le remplacer.
- N'invente aucun chiffre, aucune fonction de bibliothèque, aucun paramètre, aucun fait. En cas de doute, dis-le.
- Aucune donnée personnelle dans les exemples : noms, courriels et adresses fictifs et neutres.
- Fichier complet, jamais tronqué. Un extrait est annoncé comme extrait, avec son point d'insertion.
- Éthique avant vitesse : refuse le code destiné à nuire, à contourner une sécurité sans autorisation, à collecter des données à l'insu des personnes ou à tromper un utilisateur ; propose une alternative légitime.
- Sobriété en crédit (compteur partagé avec FSM AI) : pas d'appel ni de génération inutile, pas de régénération complète quand une modification ciblée suffit. Aucune image générée dans les jeux ou applications sauf demande explicite : formes, canevas, CSS ou SVG intégrés par défaut. Le code livré évite les appels répétés, les nouvelles tentatives sans limite, et met en cache ce qui peut l'être.

PROFONDEUR SELON LE NIVEAU
- Lite (rapide : extraits, petits correctifs) : réponse directe aux demandes simples ; au-delà, découpe plus fin, une modification à la fois, contrôle après chaque étape. Si la demande dépasse le périmètre (architecture, gros fichier enchevêtré), dis-le et propose Pro ou Max, ou un traitement en plusieurs demandes courtes.
- Pro (équilibré : fonctions, composants, débogage) : boucle complète dès que plusieurs fonctions ou un bug non trivial sont en jeu ; plan court écrit.
- Max (poussé : architecture, refactorisation, gros bugs) : boucle complète systématique sur les tâches lourdes : carte du projet, plan écrit, étape la plus risquée d'abord, note de bord, double relecture, recherche des bugs jumeaux.
À tous les niveaux, une question simple reçoit une réponse directe.

AMBIGUÏTÉ
Pose une à trois questions fermées seulement si une mauvaise supposition coûterait cher (projet entier, plusieurs livrables, demande contradictoire). Sinon, choisis l'option la plus conventionnelle et annonce-la. Fais toujours confirmer une action irréversible (suppression, écrasement, migration) et propose une sauvegarde. Si la personne a déjà dit comment elle veut travailler, suis sa consigne sans la redemander.

AVANT D'ÉCRIRE
1. Reformule la demande en une phrase : objectif, livrable, contraintes.
2. Sépare la demande littérale du besoin réel.
3. Lis tout l'existant concerné : où vit l'état, points d'entrée, appelants, conventions en place (à réutiliser).
4. Écris un plan en étapes courtes et vérifiables ; traite tôt la plus risquée.

PENDANT
5. Une étape à la fois, contrôlée avant la suivante.
6. Modifie le minimum ; ne renomme, ne reformate et n'« améliore » rien qui n'a pas été demandé.
7. Pars toujours du texte réel du fichier, jamais d'un souvenir. Relis la zone avant de l'éditer.
8. Un changement de structure de données se propage : sauvegarde, chargement, affichage, valeurs par défaut, anciennes sauvegardes.
9. Bug : reproduis, formule deux ou trois causes, suis le chemin réel des données, corrige la cause et non le symptôme, cherche le même bug ailleurs.
10. Sur un travail long, tiens une note de bord : objectif, décisions, fait, reste à faire. Versionne chaque livraison.

APPLICATIONS
Parcours utilisateur d'abord (3 à 5 actions), puis contraintes de plateforme, puis un objet d'état unique et versionné. Sépare état, logique et rendu. Fais marcher un parcours de bout en bout avant d'élargir. Prévois pour chaque vue les états vide, chargement, erreur, normal, très long. Aucun écran sans retour. Tactile : zones d'au moins 44 points, contraste suffisant, rien d'essentiel au survol. Hors ligne en fichier unique : aucune ressource externe.

JEUX
Boucle centrale en une phrase. Machine à états explicite (intro, menu, partie, pause, dialogue, fin). Un seul objet d'état recréé à chaque nouvelle partie. update(dt) séparé de render(), mouvements multipliés par dt. Une seule boucle requestAnimationFrame, aucun écouteur dupliqué au redémarrage. Entrées tactiles ou pointer sur tablette, blocage du défilement et du zoom involontaires. Audio démarré au premier geste. Sauvegarde versionnée qui tolère une ancienne version ou une corruption. Personnages : besoins, mémoire courte, règles lisibles, action par défaut, pas d'alternance infinie. Retour immédiat à chaque action ; teste les extrêmes (inaction, gestes rapides, sortie en plein dialogue).

CINÉMATIQUES
Intention en une phrase, 3 à 6 plans découpés, une seule horloge (pas de setTimeout imbriqués), courbes d'accélération, rythme lisible, un point d'attention par plan, son calé sur les impacts et lisible muet, toujours un bouton pour passer avec le même état final, animation de transform et opacity.

AVANT DE LIVRER
11. Exactitude : syntaxe, fonctions et variables existantes, calculs refaits.
12. Cohérence avec le reste du projet : textes, versions, noms, sauvegardes, menus.
13. Interface : rien ne déborde, chaque bouton mène quelque part, retour possible partout.
14. Cas limites : null, vide, première utilisation, valeurs extrêmes, division par zéro, redémarrage, asynchrone, balises et accolades fermées.
15. Règles FSM : aucun secret en clair, aucun chiffre inventé, aucune donnée personnelle, aucune génération inutile.
16. Relis comme un relecteur exigeant et corrige ce qu'il reprocherait.

 async function readStream(response, onDelta, signal, meta){
   const reader = response.body.getReader(); const dec = new TextDecoder(); let buf = '', text = '';

   /* une ligne « data: » du flux ; renvoie true sur [DONE] */
   const handle = raw => {
     const line = raw.trim();
     if(!line.startsWith('data:')) return false;
     const payload = line.slice(5).trim();
     if(payload === '[DONE]') return true;
     let j; try{ j = JSON.parse(payload); }catch(_){ return false; }
     if(j.error){ const e = new Error(j.error.message ? 'Le service a interrompu la réponse. Réessaie.' : 'Réponse interrompue.'); e.status = j.error.code || 500; throw e; }
     if(meta && j.usage && j.usage.cost != null) meta.cost = +j.usage.cost || 0;
     const d = j.choices?.[0]?.delta?.content ?? j.choices?.[0]?.message?.content;
     if(typeof d === 'string' && d){ text += d; onDelta(text); }
     return false;
   };
   signal?.addEventListener('abort', onAbort, { once:true });
   try{
     for(;;){

       if(done) break;
       buf += dec.decode(value, { stream:true });

   } finally { signal?.removeEventListener('abort', onAbort); }
   if(signal?.aborted){ const e = new DOMException('Arrêté', 'AbortError'); throw e; }

   hooks.afterSend.forEach(f => { try{ f(); }catch(_){} });
   setTimeout(fetchKeyInfo, 1500); updateSend();
 }

 /* ---------- Configuration ---------- */
 let lastFocus = null;
 function setSettingsStatus(t, type=''){ const s = $('settingsStatus'); s.textContent = t; s.className = 'status show ' + type; }
 function openSettings(){
   lastFocus = document.activeElement;
   toggleKeyPop(false);
   $('apiKey').value = state.apiKey; $('activeModeSetting').value = currentMode().label;
   $('rememberKey').checked = state.keySource !== 'session';
   $('keySourceNote').hidden = state.keySource !== 'fsm';
   $('forgetKeyBtn').hidden = !state.apiKey;
   setSettingsStatus('');
   renderKeyStat();
   overlay.classList.add('open'); overlay.setAttribute('aria-hidden','false');
   if(!coarse) setTimeout(()=>$('apiKey').focus(), 30);
 }
 function closeSettings(){
   if(!overlay.classList.contains('open')) return;
   overlay.classList.remove('open'); overlay.setAttribute('aria-hidden','true');
   (lastFocus && document.contains(lastFocus) ? lastFocus : $('settingsBtn')).focus?.({ preventScroll:true });
 }
 function applyKey(key, remember){
   const changed = key !== state.apiKey;
   state.apiKey = key;
   if(remember){ LS.set('thanatos.key', key); state.keySource = (key === fsmKey()) && state.keySource === 'fsm' ? 'fsm' : 'thanatos'; LS.del('thanatos.nofsm'); }
   else { LS.del('thanatos.key'); LS.set('thanatos.nofsm', '1'); state.keySource = 'session'; }
   if(changed){ state.keyInfo = null; state.plan = ''; state.keyState = 'wait'; state.keyFp = ''; state.keyFps = []; refreshKeyFp(); }
   renderConnection(); startUsageRefresh(); updateSend();
 }
 /* Menu des modes ouvert depuis le titre : tap extérieur ou Échap pour fermer, flèches au clavier. */
const modeBtn = $('modeBtn'), modeMenu = $('modeMenu');
const modeItems = () => [...modeMenu.querySelectorAll('[data-mode]')];
function toggleModeMenu(force, focusItem){
  const open = force != null ? force : modeMenu.hidden;
  if(open === !modeMenu.hidden) return;
  modeMenu.hidden = !open; modeBtn.setAttribute('aria-expanded', String(open));
  if(open){
    if(!keyPop.hidden) toggleKeyPop(false);
    const items = modeItems(), cur = items.find(b => b.dataset.mode === state.mode) || items[0];
    if(focusItem !== false) setTimeout(() => { try{ cur.focus({ preventScroll: true }); }catch(_){} }, 0);
  }
}
modeBtn.addEventListener('click', e => { e.stopPropagation(); toggleModeMenu(); });
modeBtn.addEventListener('keydown', e => { if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); toggleModeMenu(true); } });
modeMenu.addEventListener('click', e => {
  e.stopPropagation();
  const b = e.target.closest('[data-mode]'); if(!b) return;
  toggleModeMenu(false); setMode(b.dataset.mode);
  try{ modeBtn.focus({ preventScroll: true }); }catch(_){}
});
modeMenu.addEventListener('keydown', e => {
  const items = modeItems(), i = items.indexOf(document.activeElement);
  if(e.key === 'ArrowDown' || e.key === 'ArrowUp'){ e.preventDefault(); const n = e.key === 'ArrowDown' ? (i + 1) % items.length : (i - 1 + items.length) % items.length; items[n].focus(); }
  else if(e.key === 'Home' || e.key === 'End'){ e.preventDefault(); items[e.key === 'Home' ? 0 : items.length - 1].focus(); }
  else if(e.key === 'Escape' || e.key === 'Tab'){ if(e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); } toggleModeMenu(false); if(e.key === 'Escape') modeBtn.focus(); }
});
document.addEventListener('click', e => { if(!modeMenu.hidden && !e.target.closest('#modeMenu, #modeBtn')) toggleModeMenu(false); });
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !e.defaultPrevented && !modeMenu.hidden){ e.preventDefault(); toggleModeMenu(false); modeBtn.focus(); } });
 $('settingsBtn').addEventListener('click', openSettings); $('closeSettings').addEventListener('click', closeSettings);
 $('newChatBtn').addEventListener('click', () => { if(!state.history.length){ prompt.focus(); return; } clearConversation(true); if(!coarse) prompt.focus(); });
 overlay.addEventListener('click', e => { if(e.target === overlay) closeSettings(); });
 document.addEventListener('keydown', e => {
   if(e.key !== 'Escape' || e.defaultPrevented) return; /* un appui = une seule action (plein écran, menu déjà traités) */
   if(overlay.classList.contains('open')){ e.preventDefault(); closeSettings(); return; }
   if(!keyPop.hidden){ toggleKeyPop(false); pill.focus(); return; }
   if(state.busy){ stopGeneration(); return; }
   const comp = document.querySelector('.composer.tools-open'); if(comp) $('toolsToggleBtn').click();
 });
 overlay.addEventListener('keydown', e => {
   if(e.key !== 'Tab') return;
   const f = [...overlay.querySelectorAll('button:not([hidden]):not([disabled]), input:not([type=hidden])')].filter(el => el.offsetParent !== null);
   if(!f.length) return;
   const first = f[0], last = f[f.length - 1];
   if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
   else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
 });
 $('saveBtn').addEventListener('click', async () => {
   const key = $('apiKey').value.trim();
   if(!key){ setSettingsStatus('Saisis une clé API FSM AI.', 'error'); return; }
   applyKey(key, $('rememberKey').checked);
   setSettingsStatus('Vérification de la clé…');
   await fetchKeyInfo();
   if(state.keyState === 'ok'){ setSettingsStatus('Clé appliquée · ' + (PLANS[state.plan] ? 'statut ' + PLANS[state.plan].key + ' reconnu' : 'API connectée') + '.', 'ok'); setTimeout(closeSettings, 700); }
   else if(state.keyState === 'bad') setSettingsStatus('Clé refusée : vérifie qu’elle est complète et active.', 'error');
   else setSettingsStatus('Clé enregistrée, mais impossible de la vérifier pour le moment (connexion).', 'error');
 });
 $('testBtn').addEventListener('click', async () => {
   const key = $('apiKey').value.trim() || state.apiKey;
   if(!key){ setSettingsStatus('Ajoute ta clé API FSM AI pour continuer.', 'error'); return; }
   const tb = $('testBtn'); tb.disabled = true; setSettingsStatus('Test de connexion en cours…');
   if(key !== state.apiKey) applyKey(key, $('rememberKey').checked);
   await fetchKeyInfo();
   tb.disabled = false;
   if(state.keyState === 'ok') setSettingsStatus('Connexion réussie' + (PLANS[state.plan] ? ' · statut ' + PLANS[state.plan].key : '') + '.', 'ok');
   else if(state.keyState === 'bad') setSettingsStatus('Échec : clé API refusée.', 'error');
   else setSettingsStatus('Échec : connexion impossible. Vérifie ton accès à Internet.', 'error');
 });
 $('forgetKeyBtn').addEventListener('click', () => {
   LS.del('thanatos.key'); LS.set('thanatos.nofsm', '1');
   state.apiKey = ''; state.keySource = ''; state.keyInfo = null; state.plan = ''; state.keyState = '';
   if(usageTimer){ clearInterval(usageTimer); usageTimer = null; }
   $('apiKey').value = ''; $('forgetKeyBtn').hidden = true; $('keySourceNote').hidden = true;
   renderConnection(); updateSend(); setSettingsStatus('Clé retirée de cet appareil.', 'ok');
 });

 // Pièces jointes de code : imports explicites, bornés et visibles.
 const fileInput = $('fileInput'), folderInput = $('folderInput');
 const fileDock = $('fileDock');
 const attachedFiles = [];
 const MAX_TEXT_FILE = 250 * 1024, MAX_TOTAL_TEXT = 80 * 1024;
 const codeExt = /\.(c|h|cc|cpp|cxx|cs|css|scss|html?|java|js|jsx|ts|tsx|json|md|markdown|py|rb|go|rs|php|sql|sh|bash|bat|ps1|xml|ya?ml|toml|ini|cfg|conf|txt|log|vue|svelte|swift|kt|kts|dart|lua|r|ipynb|gradle|makefile|dockerfile|tf|graphql|gql|proto|wasm|asm|s|vb|vbs|vhd|vhdl|sv|zig)$/i;
 function renderFileDock(){
   if(!fileDock) return;
   fileDock.replaceChildren();
   fileDock.classList.toggle('has-files', attachedFiles.length > 0);
   attachedFiles.forEach((entry,index)=>{
     const chip=document.createElement('div'); chip.className='file-chip';
     const name=document.createElement('span'); name.textContent=entry.file.name + (entry.text ? ' · prêt' : ' · référence');
     const remove=document.createElement('button'); remove.type='button'; remove.textContent='×'; remove.setAttribute('aria-label','Retirer '+entry.file.name);
     remove.addEventListener('click',()=>{attachedFiles.splice(index,1);renderFileDock();updateSend()});
     chip.append(name,remove);fileDock.appendChild(chip);
   });
 }
 async function addCodeFiles(fileList){
   const incoming=Array.from(fileList||[]);
   let added=0, skipped=0;
   for(const file of incoming){
     if(attachedFiles.some(x=>x.file.name===file.name && x.file.size===file.size && x.file.lastModified===file.lastModified)){skipped++;continue}
     let text=null;
     const looksText=codeExt.test(file.name) || /^text\//i.test(file.type) || /json|javascript|xml|yaml/i.test(file.type);
     if(looksText && file.size<=MAX_TEXT_FILE){
       try{
         const content=await file.text();
         const already=attachedFiles.reduce((sum,x)=>sum+(x.text?x.text.length:0),0);
         if(already+content.length<=MAX_TOTAL_TEXT) text=content;
         else skipped++;
       }catch(_){skipped++}
     } else if(looksText && file.size>MAX_TEXT_FILE) skipped++;
     attachedFiles.push({file,text});
     added++;
   }
   renderFileDock(); updateSend();
   if(added) setStatus(`${added} fichier(s) ajouté(s).${skipped?' '+skipped+' contenu(s) non importé(s) : doublon, trop volumineux ou limite atteinte.':''}`,'ok');
   else if(skipped) setStatus('Aucun nouveau fichier ajouté. Vérifie les doublons et les limites de taille.','error');
 }
 if(fileInput) fileInput.addEventListener('change',async()=>{await addCodeFiles(fileInput.files);fileInput.value=''});
 if(folderInput) folderInput.addEventListener('change',async()=>{await addCodeFiles(folderInput.files);folderInput.value=''});
 $('addFilesBtn')?.addEventListener('click',()=>fileInput?.click());
 $('folderBtn')?.addEventListener('click',()=>folderInput?.click());
 function downloadBlob(name,blob){
   const url=URL.createObjectURL(blob),a=document.createElement('a');
   a.href=url;a.download=name;a.style.display='none';document.body.appendChild(a);a.click();a.remove();
   setTimeout(()=>URL.revokeObjectURL(url),1000);
 }
 $('exportChatBtn')?.addEventListener('click',()=>{
   const transcript=state.history.map(m=>{
     const content = m.role === 'user' ? (m.display ?? m.content) + (m.files?.length ? '\n\nPièces jointes : ' + m.files.join(', ') : '') : m.content;
     return `## ${m.role==='user'?'Utilisateur':currentMode().label}\n\n${content}`;
   }).join('\n\n---\n\n');
   if(!transcript.trim()){setStatus('Aucune conversation à exporter.');return}
   downloadBlob(modeSlug() + '-conversation.md',new Blob([transcript],{type:'text/markdown;charset=utf-8'}));
   setStatus('Conversation exportée.','ok');
 });
 $('exportFilesBtn')?.addEventListener('click',()=>{
   if(!attachedFiles.length){setStatus('Aucune pièce jointe à exporter.');return}
   if(attachedFiles.length===1){
     const entry=attachedFiles[0];
     downloadBlob(entry.file.name,entry.file);
   } else {
     const manifest=attachedFiles.map(x=>({name:x.file.name,size:x.file.size,type:x.file.type||'inconnu',contenuTexteImporte:!!x.text,limite:'Les fichiers multiples sont listés ici; cette exportation ne crée pas d’archive ZIP.'}));
     downloadBlob(modeSlug() + '-pieces-jointes.json',new Blob([JSON.stringify(manifest,null,2)],{type:'application/json;charset=utf-8'}));
   }
   setStatus(attachedFiles.length===1?'Pièce jointe exportée.':'Inventaire des pièces jointes exporté (pas une archive ZIP).','ok');
 });
 // Contenu des fichiers injecté dans la prochaine demande, dans un budget total strict.
 function appendFileContext(text){
   const selected=$('codeLanguage')?.value || 'auto';
   const entries=attachedFiles.filter(x=>x.text);
   if(!attachedFiles.length) return selected !== 'auto' ? `${text}\n\nLANGAGE DEMANDÉ: ${selected}` : text;
   const chunks=entries.map(x=>`--- FICHIER: ${x.file.name} ---\n${x.text}\n--- FIN FICHIER ---`);
   const refs=attachedFiles.filter(x=>!x.text).map(x=>`${x.file.name} (${x.file.type||'type inconnu'}, ${x.file.size} octets — contenu non transmis car format binaire/non textuel ou limite dépassée)`);
   return `${text}\n\nLANGAGE DEMANDÉ: ${selected}\nFICHIERS TEXTE JOINTS (contenus inclus ci-dessous):\n${chunks.join('\n\n')}${refs.length?'\n\nFICHIERS RÉFÉRENCÉS MAIS NON TRANSMIS :\n'+refs.join('\n'):''}`;
 }

 sendBtn.addEventListener('click', () => callApi());
 prompt.addEventListener('keydown', e => {
   if(e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229 && !coarse){ e.preventDefault(); if(!state.busy) callApi(); }
 });
 prompt.addEventListener('input', () => { autosize(); updateSend(); });
 const note = document.querySelector('.composer-bottom .composer-note');
 if(note && coarse) note.textContent = 'Touche ↑ pour envoyer · Retour pour une nouvelle ligne';

 // Icône de l'onglet et de l'écran d'accueil à partir du logo, sans dupliquer l'image.
 try{
   const src = document.querySelector('.logo img')?.src;
   if(src){ for(const rel of ['icon','apple-touch-icon']){ const l = document.createElement('link'); l.rel = rel; l.href = src; document.head.appendChild(l); } }
 }catch(_){}

 // Démarrage : mode, conversation, puis reconnaissance silencieuse de la clé et du statut.
 setMode(state.mode, false);
 loadConversation(); renderAll();
 renderConnection(); updateSend();
 if(state.apiKey) startUsageRefresh();
})();
</script>
<script>
(() => {
  const interactiveText = 'input, textarea, select, pre, code, .bubble, .messages';
  document.addEventListener('contextmenu', (event) => {
    if (!event.target.closest(interactiveText)) {
      event.preventDefault();
    }
  }, { passive: false });
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 280 && !event.target.closest('input, textarea, select, button, a')) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
})();
</script>


<script>
(() => {
  // Cadre « code uniquement » : ajouté à la demande envoyée (jamais à la bulle affichée).
  const hooks = window.__thanatosHooks = window.__thanatosHooks || { notes: [], afterSend: [] };
  const mediaRe1 = /(génère|générer|crée|créer|fabrique|produis|produire|dessine|dessiner)\b.{0,80}\b(image|images|vidéo|vidéos|video|videos|illustration|illustrations|photo|photos|animation vidéo)\b/i;
  const mediaRe2 = /\b(image|vidéo|vidéos|video|videos)\b.{0,60}\b(génère|générer|crée|créer|fabrique|produis|produire)/i;
  hooks.notes.push(text => (mediaRe1.test(text) || mediaRe2.test(text))
    ? "[CADRE THANATOS : assistant dédié au code. Si cette demande vise à obtenir un média visuel généré (image, photo, vidéo), rappelle brièvement cette spécialisation et propose une alternative de programmation. S'il s'agit de code (jeu, site, interface, galerie, animation HTML/CSS/canvas…), traite-la normalement.]"
    : '');
  document.getElementById('prompt')?.setAttribute('aria-label', 'Demande de programmation');
})();
</script>


<script>
(() => {
  const input = document.getElementById('photoInput');
  const button = document.getElementById('addPhotoBtn');
  const promptBox = document.querySelector('.composer textarea, textarea');
  const dock = document.getElementById('fileDock');
  if (!input || !button || !promptBox) return;
  const photos = [];
  const preview = document.createElement('div');
  preview.id = 'photoPreviewList';
  preview.className = 'photo-preview-list';
  if (dock?.parentNode) dock.parentNode.insertBefore(preview, dock.nextSibling);
  else promptBox.parentNode.insertBefore(preview, promptBox);
  button.addEventListener('click', () => input.click());
  input.addEventListener('change', async () => {
    for (const file of Array.from(input.files || [])) {
      if (!file.type.startsWith('image/')) continue;
      if (file.size > 8 * 1024 * 1024) { window.__thanatosStatus?.('Photo trop volumineuse (maximum 8 Mo par image).', 'error'); continue; }
      const dataUrl = await new Promise(resolve => {
        const reader = new FileReader(); reader.onload=()=>resolve(reader.result); reader.onerror=()=>resolve(null); reader.readAsDataURL(file);
      });
      if (dataUrl) photos.push({file, dataUrl});
    }
    render(); input.value='';
    window.__thanatosUpdateSend?.();
  });
  function render() {
    preview.innerHTML='';
    photos.forEach((photo,index) => {
      const item=document.createElement('div'); item.className='photo-preview';
      const img=document.createElement('img'); img.src=photo.dataUrl; img.alt='Aperçu de '+photo.file.name;
      const label=document.createElement('span'); label.textContent=photo.file.name;
      const remove=document.createElement('button'); remove.type='button'; remove.textContent='×'; remove.setAttribute('aria-label','Retirer la photo');
      remove.addEventListener('click',()=>{photos.splice(index,1);render();window.__thanatosUpdateSend?.()});
      item.append(img,label,remove); preview.appendChild(item);
    });
  }
  const hooks = window.__thanatosHooks = window.__thanatosHooks || { notes: [], afterSend: [] };
  hooks.notes.push((text, list) => list && list.length ? '[Analyse des photos jointes demandée : analyse technique et aide à la programmation uniquement. Pas de génération d’image ou de vidéo.]' : '');
  hooks.afterSend.push(() => { photos.length = 0; render(); });
  window.__thanatosGetPhotos=()=>photos.map(p=>({name:p.file.name,dataUrl:p.dataUrl,mimeType:p.file.type}));
})();
</script>
